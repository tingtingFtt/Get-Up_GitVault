name: Android 15 native Git regression

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-git-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-android15:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build native regression APKs
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check streaming objects, batch then standalone, cancellation and retry on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd android && bash gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.gitvault.app.JgitInflaterRegressionTest,com.gitvault.app.GitTransferTest,com.gitvault.app.DiagnosticsIntegrationTest
      - name: Upload native regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GitVault-android15-git-regression
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
