name: Deploy Static Content to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and regression tests
        run: |
          npm run lint
          npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build -- --base=/Get-Up_GitVault/

      - name: Include published APK update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-update-feed.mjs

      - name: Check build output
        run: test -f dist/index.html

      - name: Check responsive layouts in Chrome
        run: npm run test:layout

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
